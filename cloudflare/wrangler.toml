name = "proposal-desk"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
GH_REPO = "abhishekwasu-hue/law-judiciary-service-rules"
# SUPABASE_URL and SUPABASE_ANON_KEY are set by .github/workflows/deploy.yml (--var); secrets: SUPABASE_SERVICE_KEY, GH_TOKEN
