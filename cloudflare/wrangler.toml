# प्रस्ताव कक्ष Worker (app B). No keys here: all keys/URLs are entered on the app's Settings screen (KV "SETTINGS").
# Before the first deploy: `npx wrangler kv namespace create SETTINGS` and paste the printed id below.
name = "prastav-kaksha"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "../dashboard-app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# true: every request passes the Worker, which adds CSP / frame-ancestors to HTML (A3 audit); /api/* as before
run_worker_first = true

[[kv_namespaces]]
binding = "SETTINGS"
id = "a366dfbd5d92462e900b583fed5e8eed"
