name: Download extra PDFs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extra:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { fetch-depth: 1, persist-credentials: false }   # S-F14: the commit step authenticates itself
      # audit 05.11.2026 R-F13: each PDF is downloaded to a temp file and moved into pdf/ ONLY when it arrived complete and
      # starts with %PDF. A failed download never touches (and never deletes) a file that is already in the repo; it is
      # only listed in pdf/FAILED-extra.txt.
      - name: Download PDFs listed in pdf-list-extra.tsv
        timeout-minutes: 25
        run: |
          set -u
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          TMP=$(mktemp -d)
          : > pdf/FAILED-extra.txt
          while IFS=$'\t' read -r folder url name || [ -n "${folder:-}" ]; do
            [ -n "${url:-}" ] || continue
            mkdir -p "pdf/$folder"
            t="$TMP/dl.pdf"; rm -f "$t"
            if curl -sSL --max-time 120 --fail -A "$UA" -o "$t" "$url" && [ -s "$t" ] && head -c 5 "$t" | grep -q '%PDF'; then
              mv -f "$t" "pdf/$folder/$name"; echo "OK $url"
            else
              rm -f "$t"; echo "$url" >> pdf/FAILED-extra.txt
              if [ -e "pdf/$folder/$name" ]; then echo "FAILED (existing file kept) $url"; else echo "FAILED $url"; fi
            fi
          done < pdf-list-extra.tsv
          rm -rf "$TMP"
      - name: Commit
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # this step only (checkout keeps no credentials)
        run: |
          # S-F14: checkout keeps no credentials; the token reaches git only via an env-based credential helper
          git config credential.helper '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add pdf
          git commit -m "Add extra rule PDFs" || echo nothing
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break || sleep 8; done
