name: Process proposal
# Triggered by the dashboard Worker: repository_dispatch event "process_proposal", payload {case_id, run_id}.
# Inputs come from Supabase Storage and outputs go back there. Case files are never committed to this repo.
on:
  repository_dispatch:
    types: [process_proposal]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'runs.id in Supabase'
        required: true
permissions:
  contents: write
concurrency:
  group: proposal-${{ github.event.client_payload.case_id || github.event.inputs.run_id }}
  cancel-in-progress: false
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  RUN_ID: ${{ github.event.client_payload.run_id || github.event.inputs.run_id }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download proposal and reference documents from Supabase
        id: fetch
        run: python3 tools/sb.py fetch "$RUN_ID"
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y poppler-utils tesseract-ocr libreoffice-writer-nogui fonts-freefont-ttf
          pip install pymupdf docxcompose python-docx matplotlib
          npm install -g @anthropic-ai/claude-code@2.0.14
      - name: Process (Claude Code headless with the repo CLAUDE.md)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREFIX: ${{ steps.fetch.outputs.prefix }}
        run: |
          python3 tools/sb.py watch "$RUN_ID" "$PREFIX" &
          WATCH=$!
          tools/run_headless.sh "$PREFIX"
          kill $WATCH || true
      - name: Upload outputs to Supabase and update the case
        env:
          PREFIX: ${{ steps.fetch.outputs.prefix }}
        run: python3 tools/sb.py finish "$RUN_ID" "$PREFIX"
      - name: Keep newly fetched GRs (public GRs only, never case files)
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add pdf/gr tools/gr-request.txt 2>/dev/null || true
          git commit -m "GR fetched during run $RUN_ID" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
      - name: Mark failed
        if: failure()
        run: python3 tools/sb.py fail "$RUN_ID" "workflow step failed — see log"
