name: Process proposal
on:
  push:
    paths: ['inbox/*.pdf']
  workflow_dispatch:
    inputs:
      prefix:
        description: 'Case prefix (file inbox/<prefix>.pdf must exist)'
        required: true
permissions:
  contents: write
concurrency:
  group: proposal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Find new proposals
        id: find
        run: |
          if [ -n "${{ github.event.inputs.prefix }}" ]; then
            echo "list=${{ github.event.inputs.prefix }}" >> $GITHUB_OUTPUT
          else
            L=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- 'inbox/*.pdf' 2>/dev/null | sed 's#inbox/##;s#\.pdf$##' | tr '\n' ' ')
            echo "list=$L" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y poppler-utils
          pip install pymupdf docxcompose python-docx
          npm install -g @anthropic-ai/claude-code
      - name: Process each proposal (one at a time, never mixed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          for P in ${{ steps.find.outputs.list }}; do
            mkdir -p cases/$P
            echo '{"state":"running"}' > cases/$P/status.json
            git add cases/$P/status.json; git commit -qm "case $P: running" || true; git pull -q --rebase || true; git push -q || true
            tools/run_headless.sh $P
            git add cases/$P; git commit -qm "case $P: finished" || true; git pull -q --rebase || true; git push -q || true
          done
