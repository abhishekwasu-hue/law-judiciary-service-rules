name: Deploy app
# प्रस्ताव कक्ष (app B): build dashboard-app and deploy the Cloudflare Worker — same as scripts/deploy.ps1, but from
# GitHub (mobile: GitHub app / browser → Actions → "Deploy app" → Run workflow). Manual only (Abhi, 02.11.2026: deploy from mobile).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare → My Profile → API Tokens → template "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare → Workers & Pages → right side "Account ID"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-app
  cancel-in-progress: false
jobs:
  deploy:
    # S-F13 (audit 05.11.2026): only main is deployed (Run workflow on another branch → the job is skipped)
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '22'
      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID हे secrets रेपोमध्ये भरलेले नाहीत (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Worker tests
        run: node --test cloudflare/test/worker.test.mjs
      - name: Build front end
        working-directory: dashboard-app
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/index.html
      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.1 deploy
