name: fetch-refs
on:
  push:
    branches: [claude/fetch-refs]
    paths: ['.github/workflows/fetch-refs.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Round 5
        run: |
          mkdir -p r5 && cd r5
          : > ../log5.txt
          for p in "1396751 Contempt-of-Courts-Act-1971-Entire-Act" ; do set -- $p
            google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --print-to-pdf="$2.pdf" --no-pdf-header-footer "https://indiankanoon.org/doc/$1/" >>../log5.txt 2>&1 || true
          done
          ls -la >> ../log5.txt
          cd ..; git config user.name gha; git config user.email gha@example.com
          git add -A r5 log5.txt; git commit -m r5 || true; git pull --rebase origin claude/fetch-refs || true; git push
