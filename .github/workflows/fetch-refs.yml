name: fetch-refs
on:
  push:
    branches: [claude/fetch-refs]
    paths: ['.github/workflows/fetch-refs.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download round 2
        run: |
          mkdir -p contempt-refs && cd contempt-refs
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          try(){ out=$1; shift; for u in "$@"; do curl -sSL -m 90 -A "$UA" -e "https://www.google.com/" -o tmp.bin -w "$out %{http_code} %{size_download} $u\n" "$u" >>../log2.txt 2>&1 || true; if head -c4 tmp.bin 2>/dev/null | grep -q '%PDF'; then mv tmp.bin "$out"; return; fi; done; rm -f tmp.bin; echo "FAILED $out" >>../log2.txt; }
          : > ../log2.txt
          try 01-Maheshwar-Peri-CrlA549-2016.pdf https://api.sci.gov.in/jonew/judis/43769.pdf https://main.sci.gov.in/jonew/judis/43769.pdf https://www.sci.gov.in/jonew/judis/43769.pdf https://sci.gov.in/jonew/judis/43769.pdf
          try 02-SC-Bar-Assn-v-UoI-1998.pdf https://api.sci.gov.in/jonew/judis/13280.pdf https://main.sci.gov.in/jonew/judis/13280.pdf https://www.sci.gov.in/jonew/judis/13280.pdf
          try 08-BHC-Contempt-Rules-Ch34.pdf https://bombayhighcourt.gov.in/bhc/libweb/bhcrule/bhcasrules/BHCASRules34.pdf https://bombayhighcourt.nic.in/libweb/bhcrule/bhcasrules/BHCASRules34.pdf https://www.bombayhighcourt.gov.in/bhc/libweb/bhcrule/bhcasrules/BHCASRules34.pdf
          try 09-GAD-Circular-18-11-1997.pdf https://gad.maharashtra.gov.in/sites/default/files/1997.11.18.pdf https://www.gad.maharashtra.gov.in/sites/default/files/1997.11.18.pdf
          try 10-MCS-Seniority-Rules-1982.pdf https://gad.maharashtra.gov.in/sites/default/files/1982.06.21.pdf
          try 12-Contempt-of-Courts-Act-1971.pdf https://www.indiacode.nic.in/bitstream/123456789/1514/1/a1971-70.pdf https://indiacode.nic.in/bitstream/123456789/1514/1/a1971-70.pdf https://legislative.gov.in/sites/default/files/A1971-70.pdf https://www.indiacode.nic.in/bitstream/123456789/1514/1/197170.pdf https://lawmin.gov.in/sites/default/files/legislative/The%20Contempt%20of%20Courts%20Act%2C%201971.pdf https://upload.indiacode.nic.in/showfile?actid=AC_CEN_5_23_00027_197170_1517807318992&type=print&filename=Contempt_of_courts_act_1971.pdf
          ls -la | tee ../contempt-refs-log.txt
      - name: Commit
        run: |
          git config user.name gha; git config user.email gha@example.com
          git add -A contempt-refs contempt-refs-log.txt log2.txt; git commit -m "fetched refs round 2" || true; git pull --rebase origin claude/fetch-refs || true; git push
