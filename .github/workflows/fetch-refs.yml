name: fetch-refs
on:
  push:
    branches: [claude/fetch-refs]
    paths: ['.github/workflows/fetch-refs.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Round 8
        run: |
          set +e
          mkdir -p r8 && cd r8
          : > ../log8.txt
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          dl(){ curl -sSL -A "$UA" --connect-timeout 40 --max-time 150 --retry 2 -o "$1" "$2" >>../log8.txt 2>&1 || echo "FAIL $1" >> ../log8.txt; echo "$1 $(stat -c%s "$1" 2>/dev/null) $(file -b "$1" 2>/dev/null | cut -c1-40)" >> ../log8.txt; }
          dl GAD-GR-2017-09-21.pdf "https://gr.maharashtra.gov.in/Site/Upload/Government%20Resolutions/Marathi/201709211508485207.pdf"
          ls -la >> ../log8.txt
          cd ..; git config user.name gha; git config user.email gha@example.com
          git add -A r8 log8.txt; git commit -m r8; git pull --rebase origin claude/fetch-refs; git push
