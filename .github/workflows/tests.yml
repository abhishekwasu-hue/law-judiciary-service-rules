name: Tests
# Engine tools (pytest: tests/*, incl. the script tests via tests/test_scripts.py) and the Worker (node --test).
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-engine.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '20'
      - name: Install
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y fonts-freefont-ttf poppler-utils
          pip install -r tools/requirements-engine.txt pytest pyyaml==6.0.2
      - name: Python tests
        run: python -m pytest -q tests
      - name: Worker tests
        run: node --test cloudflare/test/worker.test.mjs
