name: GR library (bulk download)
on:
  push:
    paths: ['tools/gr-bulk.cfg', 'tools/gr_bulk.py']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gr-bulk
  cancel-in-progress: false
jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - run: MAX_MIN=45 python3 tools/gr_bulk.py
      - name: Commit in batches
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add gr-index && git commit -qm "GR index update" || true
          git ls-files --others --exclude-standard gr-library > /tmp/new.txt || true
          split -l 300 /tmp/new.txt /tmp/b_ || true
          for b in /tmp/b_*; do [ -e "$b" ] || continue; xargs -d '\n' git add -- < "$b"; git commit -qm "GR library: add PDFs (batch)" || continue; done
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 10; done
