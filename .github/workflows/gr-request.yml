name: GR request (on demand)
on:
  push:
    paths: ['tools/gr-request.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gr-request
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gr_request.py
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add pdf/gr tools/gr-request.txt
          git commit -m "GR request: fetched" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
