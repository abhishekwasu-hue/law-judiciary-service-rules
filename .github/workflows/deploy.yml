name: Deploy dashboard
# One-click (and on every push to main touching the app): Supabase schema + seed, then build the PWA and deploy the Worker.
# Needs repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD,
# SUPABASE_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GH_DISPATCH_TOKEN. Optional: E2E_TEST_PASSWORD.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'cloudflare/**', 'supabase/**', '.github/workflows/deploy.yml']
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check secrets
        run: |
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_KEY SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!v}" ] || { echo "::error::secret missing: $v"; exit 1; }
          done
          [ -n "${{ secrets.GH_DISPATCH_TOKEN }}" ] || { echo "::error::secret missing: GH_DISPATCH_TOKEN"; exit 1; }
      - name: Supabase — apply migrations
        run: |
          npx --yes supabase@2.121.0 link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@2.121.0 db push -p "$SUPABASE_DB_PASSWORD" --include-all
      - name: Supabase — auth settings (email OTP code, site URL)
        run: python3 tools/deploy_auth.py
      - name: Supabase — seed GR library and register search
        run: python3 tools/sb.py seed
      - name: Supabase — test user for the end-to-end test (optional)
        if: env.E2E_TEST_PASSWORD != ''
        run: python3 tools/deploy_auth.py e2e-user
      - name: Build PWA
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Deploy Worker (API + PWA)
        working-directory: cloudflare
        run: |
          npx --yes wrangler@4.151.0 deploy --var SUPABASE_URL:"$SUPABASE_URL" --var SUPABASE_ANON_KEY:"$SUPABASE_ANON_KEY"
          printf '%s' "$SUPABASE_SERVICE_KEY" | npx --yes wrangler@4.151.0 secret put SUPABASE_SERVICE_KEY
          printf '%s' "${{ secrets.GH_DISPATCH_TOKEN }}" | npx --yes wrangler@4.151.0 secret put GH_TOKEN
