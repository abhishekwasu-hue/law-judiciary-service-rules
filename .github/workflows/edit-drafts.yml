name: Edit drafts
# सुधारणा-चॅट (docs/DRAFT_EDIT_DESIGN.md point 4 + Addendum A, 04.11.2026). The Worker (POST /api/edit) creates a runs row
# kind 'edit' and dispatches `edit_drafts` with client_payload {case_id, run_id, token, worker} — the same payload / token
# scheme as process_proposal; keys come from the Worker at run time (/api/engine/config, masked; no repo secrets).
# tools/edit_drafts.py makes ONE Messages API call (or none: attach-only), lints, rebuilds only the changed outputs,
# checks them and uploads new versions. No Claude Code and no sandbox: nothing the model writes is executed.
# Every failure (also cancel / time-out / config failure) is recorded on the run with a Marathi reason.
on:
  repository_dispatch:
    types: [edit_drafts]
  workflow_dispatch:
    inputs:
      case_id: { description: 'cases.id', required: true }
      run_id: { description: 'runs.id (kind edit, created by the Worker /api/edit)', required: true }
      token: { description: 'run token (from the Worker)', required: true }
      worker: { description: 'Worker origin, e.g. https://xxx.workers.dev', required: true }
permissions:
  contents: read
concurrency:
  group: edit-case-${{ github.event.client_payload.case_id || github.event.inputs.case_id }}
  cancel-in-progress: false
env:
  ENGINE_SECRETS: /tmp/engine-secrets/secrets.env
  RP: /tmp/runner-priv
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        timeout-minutes: 5
        with: { fetch-depth: 1, persist-credentials: false }
      # Payload is read from the event file (never interpolated into scripts); every value is masked before use.
      # The run token is single use for the config (Worker); it stays valid for /api/engine/step|fail of this run.
      - name: Get run config from the Worker (masked)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$RP"
          E="$GITHUB_EVENT_PATH"
          CASE_ID=$(jq -r '.client_payload.case_id // .inputs.case_id // empty' "$E")
          RUN_ID=$(jq -r '.client_payload.run_id // .inputs.run_id // empty' "$E")
          TOKEN=$(jq -r '.client_payload.token // .inputs.token // empty' "$E")
          WORKER=$(jq -r '.client_payload.worker // .inputs.worker // empty' "$E")
          echo "::add-mask::$TOKEN"
          [[ "$CASE_ID" =~ ^[0-9]+$ && "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad case_id/run_id"; exit 1; }
          [[ "$WORKER" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || { echo "bad worker origin"; exit 1; }
          # first, so that "Record failure" can reach the Worker even if the config call fails
          { echo "CASE_ID=$CASE_ID"; echo "RUN_ID=$RUN_ID"; echo "RUN_TOKEN=$TOKEN"; echo "WORKER=$WORKER"; } >> "$GITHUB_ENV"
          # single-use token: retry ONLY when no HTTP response arrived at all (code 000)
          CODE=000
          for i in 1 2 3; do
            CODE=$(curl -sS -o "$RP/cfg.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                   "$WORKER/api/engine/config?run_id=$RUN_ID" || true)
            CODE=${CODE:-000}
            [ "$CODE" != "000" ] && break
            echo "config: no HTTP response (try $i/3)"; sleep 5
          done
          if [ "$CODE" != "200" ]; then
            case "$CODE" in
              412) R="सेटिंग्ज अपूर्ण आहेत. कृपया Settings मधील Anthropic key व Supabase तपासून सुधारणा पुन्हा पाठवावी, ही विनंती." ;;
              403) R="सुधारणेचे टोकन अमान्य / कालबाह्य झाले आहे. कृपया सुधारणा पुन्हा पाठवावी, ही विनंती." ;;
              *)   R="सुधारणेसाठी Worker कडून सेटिंग्ज प्राप्त झाल्या नाहीत (HTTP $CODE). कृपया सुधारणा पुन्हा पाठवावी, ही विनंती." ;;
            esac
            echo "$R" > "$RP/fail_reason.txt"; rm -f "$RP/cfg.json"; echo "config: HTTP $CODE"; exit 1
          fi
          for k in anthropic_api_key supabase_url supabase_service_key; do
            V=$(jq -r ".$k // empty" "$RP/cfg.json")
            if [ -n "$V" ]; then echo "::add-mask::$V"; fi
          done
          A=$(jq -r '.anthropic_api_key // empty' "$RP/cfg.json")
          U=$(jq -r '.supabase_url // empty' "$RP/cfg.json")
          S=$(jq -r '.supabase_service_key // empty' "$RP/cfg.json")
          M=$(jq -r '.model_edit // empty' "$RP/cfg.json")
          rm -f "$RP/cfg.json"
          if [ -z "$A" ] || [ -z "$U" ] || [ -z "$S" ]; then
            echo "सेटिंग्ज अपूर्ण आहेत. कृपया Settings मधील Anthropic key व Supabase तपासून सुधारणा पुन्हा पाठवावी, ही विनंती." > "$RP/fail_reason.txt"
            echo "config incomplete (Settings)"; exit 1
          fi
          # secrets only into the runner's 700 file (read by engine_supabase.py / edit_drafts.py), never the job env
          ( umask 077; mkdir -p "$(dirname "$ENGINE_SECRETS")"; chmod 700 "$(dirname "$ENGINE_SECRETS")"
            { echo "ANTHROPIC_API_KEY=$A"; echo "SUPABASE_URL=$U"; echo "SUPABASE_SERVICE_KEY=$S"; } > "$ENGINE_SECRETS" )
          # the edit model (KV setting model_edit, default claude-sonnet-5-5); an invalid name -> the default
          if [[ "$M" =~ ^[A-Za-z0-9][A-Za-z0-9._:@/-]{1,99}$ ]]; then echo "MODEL_EDIT=$M" >> "$GITHUB_ENV"; fi
      - name: Record log URL
        timeout-minutes: 2
        run: python3 tools/engine_supabase.py log_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        timeout-minutes: 10
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-engine.txt
      # python-docx + docxcompose + pymupdf (pinned); FreeSerif for the package page stamps (tools/pkg3.py). No
      # LibreOffice: no previews; a Word attachment is refused with "… PDF करून जोडावी, ही विनंती".
      - name: Install tools
        timeout-minutes: 8
        run: |
          set -euo pipefail
          trap 'echo "आवश्यक साधने install होऊ शकली नाहीत (apt/pip). कृपया सुधारणा पुन्हा पाठवावी, ही विनंती." > "$RP/fail_reason.txt"' ERR
          sudo apt-get update -y
          sudo apt-get install -y fonts-freefont-ttf
          pip install -r tools/requirements-engine.txt
      - name: Edit the drafts (edit_drafts.py)
        timeout-minutes: 15
        run: python3 tools/edit_drafts.py --work /tmp/edit-work
      - name: Record failure
        if: failure() || cancelled()
        timeout-minutes: 5
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          R=""
          if [ -s "$RP/fail_reason.txt" ]; then R=$(head -c 600 "$RP/fail_reason.txt"); fi
          if [ -z "$R" ]; then
            if [ "$JOB_STATUS" = "cancelled" ]; then R="सुधारणा थांबविण्यात आली / वेळ संपली. कृपया सुधारणा पुन्हा पाठवावी, ही विनंती."
            else R="सुधारणा पूर्ण होऊ शकली नाही. कृपया सुधारणा पुन्हा पाठवावी, ही विनंती."; fi
          fi
          # 1) with the Supabase key (keeps an earlier, more specific reason); 2) always also via the Worker + run token
          if [ -s "$ENGINE_SECRETS" ]; then
            python3 tools/engine_supabase.py fail "$R" || true
          fi
          if [ -n "${RUN_TOKEN:-}" ] && [ -n "${WORKER:-}" ] && [ -n "${RUN_ID:-}" ]; then
            jq -n --arg r "$R" --argjson id "$RUN_ID" '{run_id: $id, reason: $r}' |
              curl -sS --retry 3 -X POST -H "Authorization: Bearer $RUN_TOKEN" -H 'content-type: application/json' \
                   --data-binary @- "$WORKER/api/engine/fail" || echo "could not reach the Worker"
          fi
          exit 0
