name: Download GR PDFs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { fetch-depth: 1, persist-credentials: false }   # S-F14: the commit step authenticates itself
      # audit 05.11.2026 R-F13: download to a temp file, move into pdf/ only on success (%PDF header); a failure never
      # deletes a file that is already in the repo.
      - name: Download PDFs listed in pdf-list.tsv
        timeout-minutes: 50
        run: |
          set -u
          mkdir -p pdf
          ok=0; fail=0
          TMP=$(mktemp -d)
          : > pdf/FAILED.txt
          while IFS=$'\t' read -r folder url name || [ -n "${folder:-}" ]; do
            [ -n "${url:-}" ] || continue
            mkdir -p "pdf/$folder"
            t="$TMP/dl.pdf"; rm -f "$t"
            if curl -sSL --max-time 90 --fail -A "Mozilla/5.0" -o "$t" "$url" && [ -s "$t" ] && head -c 5 "$t" | grep -q '%PDF'; then
              mv -f "$t" "pdf/$folder/$name"; ok=$((ok+1))
            else
              rm -f "$t"; fail=$((fail+1)); echo "$url" >> pdf/FAILED.txt
            fi
          done < pdf-list.tsv
          rm -rf "$TMP"
          echo "downloaded=$ok failed=$fail"
      - name: Commit PDFs
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # this step only (checkout keeps no credentials)
        run: |
          # S-F14: checkout keeps no credentials; the token reaches git only via an env-based credential helper
          git config credential.helper '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase origin main || true
          git ls-files --others --modified --exclude-standard pdf > /tmp/new.txt || true
          split -l 60 /tmp/new.txt /tmp/batch_
          for b in /tmp/batch_*; do
            [ -e "$b" ] || continue
            xargs -d '\n' git add -- < "$b"
            git commit -m "Add downloaded GR/rules PDFs (batch)" || continue
            for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
          done
